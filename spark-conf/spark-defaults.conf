# Global Spark defaults for Google Cloud connectivity (GCS + BigQuery).
# Mounted read-only at /opt/spark/conf/spark-defaults.conf on the driver
# (airflow-worker, via SparkSubmitOperator) and on spark-master (used when
# submitting jobs directly, e.g. `make spark-submit JOB=my_job.py`).
#
# Jar versions here must match the filenames downloaded by `make gcp-jars`
# (see Makefile) into ./spark/jars, which is bind-mounted as /opt/spark-apps
# on every Spark-capable container.
#
# Auth: explicit service-account keyfile. Tried relying on Application
# Default Credentials picking up GOOGLE_APPLICATION_CREDENTIALS first, but
# gcs-connector 4.0.5 fell through to the GCE metadata server instead
# ("ComputeEngineCredentials cannot find the metadata server") even with the
# env var set and readable in the container -- so point it at the keyfile
# directly instead of relying on ADC auto-discovery.
spark.jars                                          /opt/spark-apps/jars/gcs-connector-4.0.5-shaded.jar,/opt/spark-apps/jars/spark-4.1-bigquery-0.45.0.jar
spark.hadoop.fs.gs.impl                             com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem
spark.hadoop.fs.AbstractFileSystem.gs.impl          com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS
spark.hadoop.fs.gs.auth.type                        SERVICE_ACCOUNT_JSON_KEYFILE
spark.hadoop.fs.gs.auth.service.account.json.keyfile /opt/gcp/key.json
spark.hadoop.google.cloud.auth.service.account.json.keyfile /opt/gcp/key.json
spark.executor.memory                               4g

# El paquete "src" (código compartido con los DAGs de Airflow, ver CLAUDE.md)
# se monta en /opt/src en todos los contenedores. El driver ya resuelve
# `import src...` vía la env var PYTHONPATH=/opt del propio contenedor
# (docker-compose.yaml), pero los executors de spark-worker corren como
# procesos Python separados lanzados por la JVM -- spark.executorEnv.* es el
# mecanismo soportado por Spark para garantizar que hereden esa env var
# independientemente de cómo se propague el entorno del contenedor.
spark.executorEnv.PYTHONPATH                        /opt
